plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.zhiman.accessibility'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'ai.zhiman.accessibility'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
