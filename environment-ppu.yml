name: seu-vlm-ppu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Do not install torch here. The official image supplies the PPU-patched
      # runtime. bootstrap_ppu_env.sh adds CPU-only torchvision with --no-deps
      # for Qwen image preprocessing without replacing patched torch.
      - -r requirements-ppu.txt
